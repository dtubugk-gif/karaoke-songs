<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>סטודיו קריוקי</title>
<style>
:root { color-scheme: dark; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #16111d; color: #f6f1ea;
  font: 17px/1.6 system-ui, "Segoe UI", sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
.card { max-width: 420px; }
h1 { font-size: 26px; margin: 0 0 8px; } h1 span { color: #f2c14e; }
p { color: #b6abbe; margin: 0 0 20px; }
button { font: inherit; font-weight: 700; border: 0; border-radius: 11px; padding: 10px 22px; background: #f2c14e; color: #21180a; cursor: pointer; }
.spin { width: 34px; height: 34px; margin: 0 auto 18px; border-radius: 50%; border: 3px solid #3a2d4a; border-top-color: #f2c14e; animation: s 1s linear infinite; }
@keyframes s { to { transform: rotate(1turn); } }
</style></head><body><div class="card">
<div class="spin" id="spin"></div><h1>סטודיו <span>קריוקי</span></h1>
<p id="msg">פותח את הסטודיו…</p><button id="again" hidden onclick="go()">לנסות שוב</button>
</div><script>
const msg = document.getElementById("msg"), again = document.getElementById("again"), spin = document.getElementById("spin");
function show(text) { msg.textContent = text; again.hidden = false; spin.hidden = true; }
async function go() {
  again.hidden = true; spin.hidden = false; msg.textContent = "פותח את הסטודיו…";
  try {
    const info = await (await fetch("studio.json", { cache: "no-cache" })).json();
    if (!info.url) return show("הגישה מרחוק לסטודיו כבויה עכשיו. אפשר להדליק אותה בסטודיו שבמחשב.");
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 9000);
    const r = await fetch(info.url + "/api/ping", { signal: ctl.signal, cache: "no-store" });
    if (!r.ok) throw new Error();
    location.replace(info.url + "/");
  } catch {
    show("הסטודיו לא זמין עכשיו. צריך שהמחשב יהיה דלוק והסטודיו פתוח בו. אם הוא הופעל ממש עכשיו, חכו דקה ונסו שוב.");
  }
}
go();
</script></body></html>
