<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>סטודיו קריוקי</title>
<style>
:root { color-scheme: dark; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #16111d; color: #f6f1ea;
  font: 17px/1.6 system-ui, "Segoe UI", sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
.card { max-width: 420px; }
h1 { font-size: 26px; margin: 0 0 8px; } h1 span { color: #f2c14e; }
p { color: #b6abbe; margin: 0 0 20px; }
button { font: inherit; font-weight: 700; border: 0; border-radius: 11px; padding: 10px 22px; background: #f2c14e; color: #21180a; cursor: pointer; }
.spin { width: 34px; height: 34px; margin: 0 auto 18px; border-radius: 50%; border: 3px solid #3a2d4a; border-top-color: #f2c14e; animation: s 1s linear infinite; }
@keyframes s { to { transform: rotate(1turn); } }
</style></head><body><div class="card">
<div class="spin" id="spin"></div><h1>סטודיו <span>קריוקי</span></h1>
<p id="msg">פותח את הסטודיו…</p><button id="again" hidden>לנסות שוב</button>
</div><script>
const msg = document.getElementById("msg"), again = document.getElementById("again"), spin = document.getElementById("spin");
const TRIES = 18, WAIT = 10;   // keep checking for 3 minutes: the link needs about a minute after the studio starts
let tries = 0, timer = null;
function show(text, retrying) {
  msg.textContent = text + (retrying ? " בודק שוב בעוד רגע…" : "");
  again.hidden = retrying; spin.hidden = !retrying;
}
async function reachable(url) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 9000);
  try { return (await fetch(url + "/api/ping?t=" + Date.now(), { signal: ctl.signal, cache: "no-store" })).ok; }
  catch { return false; } finally { clearTimeout(t); }
}
async function go(manual) {
  clearTimeout(timer);
  if (manual) tries = 0;
  again.hidden = true; spin.hidden = false;
  if (!tries) msg.textContent = "פותח את הסטודיו…";
  tries++;
  let info = {};
  try { info = await (await fetch("studio.json?t=" + Date.now(), { cache: "no-store" })).json(); } catch { /* offline? */ }
  if (info.url && await reachable(info.url)) return location.replace(info.url + "/");
  const retrying = tries < TRIES;
  show(!info.url ? "הגישה מרחוק לסטודיו כבויה עכשיו. אפשר להדליק אותה בסטודיו שבמחשב."
                 : "הסטודיו לא זמין עכשיו. צריך שהמחשב יהיה דלוק והסטודיו פתוח בו.", retrying);
  if (retrying) timer = setTimeout(go, WAIT * 1000);
}
again.onclick = () => go(true);
go(true);
</script></body></html>
